<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SmartMelt Studio</title>
<link rel="stylesheet" href="./style.css"/>
</head>
<body>
  <nav id="topnav">
    <span id="brand">🔥 SmartMelt<small>Studio</small></span>
    <div id="tabs"></div>
    <span id="spacer"></span>
    <label id="plantwrap">Plant
      <select id="plant"></select>
    </label>
    <span id="status" class="warn">connecting…</span>
  </nav>
  <div id="layout">
    <aside id="sidebar"></aside>
    <main id="main"></main>
  </div>

  <div id="offline"><div class="box"><h3>Backend not reachable</h3>
    <div class="note">Start it and reload. Details will appear here.</div></div></div>

  <!-- startup watchdog: surface any script/module error on screen -->
  <script>
  (function(){
    function box(t,m){var o=document.getElementById('offline');if(!o)return;var b=o.querySelector('.box');
      if(b)b.innerHTML='<h3>'+t+'</h3><div class="note" style="white-space:pre-wrap;word-break:break-word">'+m+'</div>';o.style.display='flex';}
    addEventListener('error',function(e){box('Script error',(e&&(e.message||(e.error&&e.error.message)))||'unknown'+(e&&e.filename?('\n'+e.filename+':'+e.lineno):''));},true);
    addEventListener('unhandledrejection',function(e){var r=e&&e.reason;box('Error',String((r&&(r.message||r))||'unknown'));});
    setTimeout(function(){if(!window.__ready)box('App did not start','Update your browser (ES module import maps needed) or hard-refresh (Ctrl/Cmd+Shift+R). Open console (F12) for the red error.');},8000);
  })();
  </script>
  <script src="./vendor/plotly.min.js"></script>
  <script type="importmap">
  { "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
  } }
  </script>
  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
